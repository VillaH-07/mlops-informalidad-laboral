[project]
name = "informalidad"
version = "1.0.0"
description = "MLOps end-to-end: predicción de informalidad laboral en Colombia (GEIH - DANE)"
readme = "README.md"
authors = [{ name = "Juan José Villa" }]
requires-python = "==3.11.*"

# Dependencias de SERVING: lo mínimo para que la API cargue el modelo y prediga.
# Son las únicas que se instalan dentro de la imagen Docker (imagen más liviana).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5,<1.8",
    "xgboost>=2.1",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[dependency-groups]
# Entrenamiento, tracking y orquestación (no van en la imagen Docker de la API)
train = [
    "mlflow>=3.1",
    "prefect>=3.4",
    "optuna>=4.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "tabulate>=0.9",
]
# Calidad de código y pruebas
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
    # Necesario para la instalación editable "exacta" (ver tool.hatch más abajo)
    "editables>=0.5",
]

[tool.uv]
# `uv sync` instala por defecto todo (serving + train + dev).
# En Docker usamos `uv sync --no-default-groups` para instalar solo serving.
default-groups = ["train", "dev"]
# XGBoost en Linux arrastra NCCL (~470 MB), una librería solo para entrenar en varias GPUs.
# Aquí todo corre en CPU, así que la excluimos: la imagen Docker pasa de ~700 MB a ~250 MB.
override-dependencies = ["nvidia-nccl-cu12; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/informalidad"]
# Instalación editable con un import hook en vez de un archivo .pth con la ruta.
# En Windows, Python 3.11 lee los .pth con la codificación local (cp1252), así que si la
# carpeta del proyecto tiene tildes (p. ej. C:/Users/Juan José/...) el paquete no se encuentra.
dev-mode-exact = true

# ---------------------------------------------------------------------------
# Linter + formatter (ruff reemplaza a flake8 + black + isort en una sola herramienta)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "mlruns", "mlartifacts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI usa llamadas en defaults (Depends/Query)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: pruebas que entrenan modelos y usan MLflow (más lentas)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
